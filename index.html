<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Okie Maps</title>
    <meta
      name="viewport"
      content="initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.css"
      rel="stylesheet"
    />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.js"></script>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="map"></div>
    <div id="info-tab"></div>
    <div id="toggle-and-coord">
      <div id="layer-toggle">
        <input type="checkbox" id="ageToggle" checked>
        <label>Age Layer</label>
      </div>
      <div id="cursorCoordBox">
        <p>Lng: 00.0000</p>
        <p>Lat: 00.0000</p>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
